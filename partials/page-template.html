<!--
  MOLDE DE PÁGINA — copie este arquivo ao criar qualquer página nova.

  Substitua tudo entre {{ }}. Depois rode, da raiz do projeto:
      node tools/sync-layout.mjs
      node tools/check-links.mjs
      node tools/check-seo.mjs

  Regras que os verificadores cobram:
    - todo href interno é absoluto a partir da raiz: /solucoes/agentes-de-ia/
    - title, meta description e canonical precisam ser ÚNICOS no site inteiro
    - nada de href="#" — é exatamente o defeito que derrubou os cards do blog

  Marcador do nav:
      variant="solid"   navbar opaca (toda página que não é a home)
      active="..."      solucoes | clinicas | engenharia | diagnostico | casos | blog

  Armadilhas do CSS:
    - toda .section-dark precisa de <div class="pixel-texture"></div> como
      primeiro filho (o z-index do .container já vem do CSS)
    - NUNCA use style="" inline: a regra 6 do AGENTS.md proíbe. Use as classes
      utilitárias .stack-sm/.stack-md/.stack-lg/.stack-xl/.stack-block,
      .section-header--left e .hero-ctas--center
    - contadores só animam dentro de uma <section class="numbers-section">
    - nunca invente número, nome de cliente ou foto: use <!-- TODO -->
-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{META_DESCRIPTION}}">
    <!-- SEO & Open Graph -->
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{META_DESCRIPTION}}">
    <meta property="og:url" content="https://guadalupesistemas.com.br{{PATH}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Guadalupe Sistemas">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:image" content="https://guadalupesistemas.com.br/assets/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Guadalupe Sistemas - IA, automação e sistemas sob medida">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{META_DESCRIPTION}}">
    <meta name="twitter:image" content="https://guadalupesistemas.com.br/assets/og-image.jpg">
    <link rel="canonical" href="https://guadalupesistemas.com.br{{PATH}}">

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0C0A23">

    <title>{{TITLE}}</title>

    <!-- Dados estruturados (JSON-LD) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Início", "item": "https://guadalupesistemas.com.br/" },
            { "@type": "ListItem", "position": 2, "name": "{{BREADCRUMB_NAME}}", "item": "https://guadalupesistemas.com.br{{PATH}}" }
        ]
    }
    </script>

    <!-- Consentimento + Google Analytics -->
    <script src="/js/cookie-consent.js" defer></script>

    <!-- Fonts: Sora (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/styles.css">

    <!-- Icons (Font Awesome - lazy) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>
</head>

<body>

    <!-- gs:nav:start variant="solid" active="{{NAV_ACTIVE}}" -->
    <!-- gs:nav:end -->

    <main>

        <!-- ========== HERO ========== -->
        <header class="page-hero section-white">
            <div class="container">
                <nav class="breadcrumbs" aria-label="Trilha de navegação">
                    <ol>
                        <li><a href="/">Início</a></li>
                        <li><span aria-current="page">{{BREADCRUMB_NAME}}</span></li>
                    </ol>
                </nav>
                <span class="section-tag">{{EYEBROW}}</span>
                <h1 class="article-title">{{H1}}</h1>
                <p class="page-hero-subtitle">{{SUBTITLE}}</p>
                <div class="hero-ctas">
                    <a href="/diagnostico-de-ia/" class="btn btn-primary-violet" data-cta="{{SLUG}}-hero">Fazer meu
                        diagnóstico</a>
                    <a href="/casos/" class="btn-link-arrow">Ver casos reais <span class="arrow">↗</span></a>
                </div>
            </div>
        </header>

        <!-- ========== CONTEÚDO ========== -->
        <!-- {{CONTEÚDO DA PÁGINA}} -->

        <!-- ========== CTA FINAL ========== -->
        <section class="section-dark">
            <div class="pixel-texture"></div>
            <div class="container">
                <div class="section-header reveal">
                    <h2>
                        <span class="title-light">{{CTA_TITLE_LIGHT}}</span><br>
                        <span class="title-bold">{{CTA_TITLE_BOLD}}</span>
                    </h2>
                    <p class="section-subtitle">{{CTA_SUBTITLE}}</p>
                </div>
                <div class="hero-ctas hero-ctas--center">
                    <a href="/diagnostico-de-ia/" class="btn btn-primary-white" data-cta="{{SLUG}}-final">Fazer meu
                        diagnóstico</a>
                    <a href="https://wa.me/5537998323232" target="_blank" rel="noopener noreferrer"
                        class="btn btn-ghost" data-wa-origin="{{SLUG}}">Falar no WhatsApp</a>
                </div>
            </div>
        </section>

    </main>

    <!-- gs:footer:start -->
    <!-- gs:footer:end -->

    <script src="/js/analytics.js"></script>
    <script src="/js/script.js"></script>
</body>

</html>
